name: Deploy dev

# Feature 017, E4 (prompt 017, section 5, flow 3). PREPARED AND INERT until the 018: needs the
# repository variable ATLAS_DEPLOY_ENABLED = true. Builds ONCE, writes the set to the
# artifacts bucket (only this job may) under the SHA of the source tree, applies `dev`, and
# uploads the SPA without `.vite/` nor `*.map`. What terraform and aws print goes to files that
# are never uploaded. The build runs in a job WITHOUT `id-token`: no dependency script can ask
# for the OIDC token; the set reaches the job that holds the role as a one-day run artifact.
on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: atlas-deploy-dev
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.ATLAS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package the set that is promoted
        run: infra/scripts/ci/package.sh "$RUNNER_TEMP/artifact"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-set
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atlas-set
          path: ${{ runner.temp }}/artifact
      - name: Name the source tree
        run: echo "TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - name: Assume the deploy role of dev
        run: infra/scripts/ci/assume-role.sh "$ROLE_ARN"
        env:
          ROLE_ARN: ${{ secrets.ATLAS_DEV_DEPLOY_ROLE_ARN }}
      - name: Write the set to the artifacts bucket
        run: aws s3 cp "$RUNNER_TEMP/artifact/" "s3://$ARTIFACT_BUCKET/builds/$TREE/" --recursive --only-show-errors > "$RUNNER_TEMP/aws.log" 2>&1
        env:
          ARTIFACT_BUCKET: ${{ secrets.ATLAS_ARTIFACT_BUCKET }}
      - name: Apply dev
        run: |
          infra/scripts/ci/artifact-env.sh "$RUNNER_TEMP/artifact" "$TREE" > "$RUNNER_TEMP/artifact.env"
          set -a; . "$RUNNER_TEMP/artifact.env"; set +a
          infra/scripts/ci/terraform-run.sh dev apply
        env:
          ATLAS_TFVARS_B64: ${{ secrets.ATLAS_DEV_TFVARS_B64 }}
          ATLAS_BACKEND_B64: ${{ secrets.ATLAS_DEV_BACKEND_B64 }}
      - name: Upload the SPA
        run: |
          mkdir "$RUNNER_TEMP/spa" && tar -xzf "$RUNNER_TEMP/artifact/spa.tgz" -C "$RUNNER_TEMP/spa"
          # Hashed assets first and never deleted: the index.html still cached at the edge points at the previous ones.
          aws s3 sync "$RUNNER_TEMP/spa/" "s3://$SPA_BUCKET/" --exclude '*' --include 'assets/*' --exclude '.vite/*' --exclude '*.map' --cache-control 'public, max-age=31536000, immutable' --only-show-errors > "$RUNNER_TEMP/aws-spa.log" 2>&1
          # The rest (index.html included) is revalidated on every request, so a new deployment shows at once.
          aws s3 cp "$RUNNER_TEMP/spa/" "s3://$SPA_BUCKET/" --recursive --exclude 'assets/*' --exclude '.vite/*' --exclude '*.map' --cache-control 'no-cache' --only-show-errors > "$RUNNER_TEMP/aws-spa-pages.log" 2>&1
        env:
          SPA_BUCKET: ${{ secrets.ATLAS_DEV_SPA_BUCKET }}
