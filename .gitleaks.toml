# gitleaks configuration: the default ruleset plus the project's own credentials.
# Picked up automatically by `gitleaks git` / `gitleaks dir` run from the repository root
# (.githooks/pre-commit). Documented in .githooks/README.md.
title = "atlas-portfolio-tracker"

[extend]
useDefault = true

# Console device token (ADR-0033, docs/api.md §2.1): atlasdt1.<token_id>.<secret>
# - token_id: 22 chars of base64url, public (it may appear in logs and the web list);
# - secret:   43 chars of base64url, 256 random bits; this is what gets reported (secretGroup 1).
# No leading boundary: the prefix is distinctive enough, and a word boundary would miss a token
# glued to a word character (`FOO_atlasdt1…`, an escaped `\n` in a JSON string or a log line).
# The trailing guard rejects longer runs, so only the exact format matches. The entropy floor
# (computed on the secret only) skips obviously fake values such as repeated characters in
# docs or test fixtures; a random secret scores ~5. The docs' `<token_id>`/`<secret>`
# placeholders never match because `<` is outside the alphabet, so this rule needs no allowlist.
[[rules]]
id = "atlas-console-device-token"
description = "Atlas console device token (ADR-0033)"
regex = '''atlasdt1\.[A-Za-z0-9_-]{22}\.([A-Za-z0-9_-]{43})(?:[^A-Za-z0-9_-]|$)'''
secretGroup = 1
entropy = 3.5
keywords = ["atlasdt1"]

# The token_id alone is public by design (ADR-0033, point 1; docs/api.md §2.1: it names the SSM
# parameter, is listed by the web, may be logged and is returned by /api/auth/console/revoke).
# The default generic-api-key rule flags it when it sits under a key named token_id/tokenId;
# this allowlist lifts only that case: that key name and a value of exactly 22 base64url chars,
# not followed by `.` or `=` (so `<token_id>.<secret>` without the prefix is still reported).
[[allowlists]]
description = "Public console device-token id (ADR-0033)"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''(?i)\btoken_?id\b["']?\s*[:=]\s*["']?[A-Za-z0-9_-]{22}(?:[^A-Za-z0-9_.=-]|$)''']
