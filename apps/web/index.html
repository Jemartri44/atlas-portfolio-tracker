<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Restrictive CSP served by the application itself (constitution, security).
      `vite.config.ts` relaxes it in `vite dev`, where the dev server injects
      inline scripts; production keeps `script-src 'self'` with no unsafe-inline.

      `frame-ancestors` is **not** here: a `<meta>` element cannot carry it and
      the browser ignores it (Chromium says so in the console). It belongs to an
      HTTP header of the CloudFront distribution.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <!-- The colour of the browser bar: the top bar of each theme (tokens.css, --c-surface). -->
    <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1c19" media="(prefers-color-scheme: dark)" />
    <title>Atlas</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- The two hosted fonts, asked for with the page so the first paint does not jump (base.css). -->
    <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin-600.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Atlas necesita JavaScript: proyecta el libro entero en el dispositivo.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
